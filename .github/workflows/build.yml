name: Build

# Smoke test: every push to main builds the module ZIP the same way the release
# does, so a broken tree is caught before a tag is ever cut. Nothing is
# published and no version is needed - which is exactly why this can run on a
# branch push, where there is no tag to stamp module.prop from.
#
# The zip invocation mirrors "Stamp and build" in release.yml. If you change
# the exclusion list there, change it here too.
#
# The artifact is the real module ZIP, so it can be downloaded from the run and
# flashed to test without cutting a release.
#
# Two steps, one job, no third-party action beyond checkout.

on:
  push:
    branches: [main]

# It only reads the repo and uploads an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r -X dist/HyperPatch.zip . \
            -x '.git/*' '.github/*' 'dist/*' 'update.json' 'CHANGELOG.md' '.gitattributes' '.gitignore'
          unzip -l dist/HyperPatch.zip
          unzip -l dist/HyperPatch.zip | grep -q ' module\.prop$'

      - uses: actions/upload-artifact@v4
        with:
          name: HyperPatch
          path: dist/HyperPatch.zip
          if-no-files-found: error
